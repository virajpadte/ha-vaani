[project]
name = "vaani"
version = "0.1.93"
description = "Vaani: an Indic-language Home Assistant voice assistant powered by Sarvam AI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "aiohttp>=3.9.0",
    "httpx>=0.28.0",
    "loguru>=0.7.2",
    "openai>=1.99.0",
    "pipecat-ai[runner,openai,webrtc,websocket,silero,mcp,sarvam]>=1.4.0,<1.5.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
