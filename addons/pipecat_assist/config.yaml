name: Sarvam Assist
version: "0.1.91"
slug: sarvam_assist
description: Marathi and Indic-language Home Assistant voice assistant powered by Sarvam AI, with Home Assistant MCP device control and ESP32 satellite support.
url: https://github.com/virajpadte/pipecat-homeassistant-sarvam-ai
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 7860
panel_icon: mdi:account-voice
homeassistant_api: true
hassio_api: true
hassio_role: manager
options:
  runner_port: 7860
  log_level: "INFO"
schema:
  runner_port: port
  log_level: list(DEBUG|INFO|WARNING|ERROR)
